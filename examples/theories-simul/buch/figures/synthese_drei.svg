<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="800" height="470" fill="#fff"/>
<text x="40" y="50" font-size="11" fill="#777">Die relationale Ontologie kennt nur zwei stabile Regime. Das gemeinsame Ideal liegt links; die distinktiven Gesten überschreiten den Raum.</text>
<rect x="55" y="90" width="300" height="210" rx="14" fill="#46CDB8" opacity="0.10" stroke="#46CDB8"/>
<rect x="445" y="90" width="300" height="210" rx="14" fill="#E36F9E" opacity="0.10" stroke="#E36F9E"/>
<text x="205" y="116" font-size="13" font-family="Georgia,serif" fill="#2f9e8c" text-anchor="middle">Symmetrische Reziprozität</text>
<text x="205" y="132" font-size="10" fill="#3a3a3a" text-anchor="middle">das gemeinsame Ideal</text>
<text x="595" y="116" font-size="13" font-family="Georgia,serif" fill="#c45680" text-anchor="middle">Einziger Apex</text>
<text x="595" y="132" font-size="10" fill="#3a3a3a" text-anchor="middle">Satellisierung</text>
<text x="205" y="168" font-size="11" fill="#222" text-anchor="middle">Theorie der Relation (Ideal)</text>
<text x="205" y="196" font-size="11" fill="#222" text-anchor="middle">Habermas — kommunikatives Ideal</text>
<text x="205" y="224" font-size="11" fill="#222" text-anchor="middle">Luhmann — das Darstellbare</text>
<text x="205" y="252" font-size="11" fill="#222" text-anchor="middle">(Autonomie, keine Hierarchie)</text>
<text x="595" y="176" font-size="11" fill="#222" text-anchor="middle">Parsons — kybernetische Hierarchie</text>
<text x="595" y="208" font-size="11" fill="#222" text-anchor="middle">Habermas — Kolonialisierung</text>
<text x="595" y="240" font-size="11" fill="#222" text-anchor="middle">(ein Pol dominiert, drei Satelliten)</text>
<text x="400" y="330" font-size="11" font-family="Georgia,serif" fill="#2b2b2b" text-anchor="middle">Parsons</text>
<defs><marker id="m540300" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
<path d="M355,338 540,300" stroke="#888" stroke-width="2" fill="none"  marker-end="url(#m540300)"/>
<text x="400" y="352" font-size="9.5" fill="#777" text-anchor="middle">Hierarchie → Apex (darstellbar, interne Spannung)</text>
<text x="180" y="388" font-size="11" font-family="Georgia,serif" fill="#2b2b2b" text-anchor="middle">Luhmann</text>
<path d="M120,372 C60,400 60,330 150,318" stroke="#8C92EC" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#mlu)"/>
<defs><marker id="mlu" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8C92EC"/></marker></defs>
<text x="210" y="404" font-size="9.5" fill="#777" text-anchor="middle">operative Schließung → fällt in die Symmetrie zurück (nicht darstellbar)</text>
<text x="600" y="388" font-size="11" font-family="Georgia,serif" fill="#2b2b2b" text-anchor="middle">Habermas</text>
<path d="M430,372 C470,420 560,420 600,316" stroke="#E36F9E" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#mha)"/>
<defs><marker id="mha" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E36F9E"/></marker></defs>
<text x="560" y="404" font-size="9.5" fill="#777" text-anchor="middle">System/Lebenswelt-Bipolarität → kippt in den Apex (nicht darstellbar)</text>
<text x="400" y="450" font-size="10.5" fill="#555" text-anchor="middle">Das Gemeinsame ist das relationale Ideal; die distinktiven Gesten (Schließung, Dualität) überschreiten die Ontologie in entgegengesetzte Richtungen.</text>
</svg>