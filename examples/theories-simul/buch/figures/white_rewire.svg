<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="780" height="430" fill="#fff"/>
<text x="40" y="47" font-size="11" fill="#777">Wird das Netz umverdrahtet (hub = kontrollierende Position), folgt der Apex nur teilweise: nur die Politik führt sicher</text>
<line x1="120" y1="360.0" x2="720" y2="360.0" stroke="#e7e7e7"/>
<text x="112" y="363.0" font-size="10" fill="#9a9a9a" text-anchor="end">0</text>
<line x1="120" y1="290.0" x2="720" y2="290.0" stroke="#e7e7e7"/>
<text x="112" y="293.0" font-size="10" fill="#9a9a9a" text-anchor="end">25</text>
<line x1="120" y1="220.0" x2="720" y2="220.0" stroke="#e7e7e7"/>
<text x="112" y="223.0" font-size="10" fill="#9a9a9a" text-anchor="end">50</text>
<line x1="120" y1="150.0" x2="720" y2="150.0" stroke="#e7e7e7"/>
<text x="112" y="153.0" font-size="10" fill="#9a9a9a" text-anchor="end">75</text>
<rect x="160.0" y="284.4" width="80" height="75.6" fill="#cbd0d8" rx="3"/>
<text x="200.0" y="277.4" font-size="13" font-family="Georgia,serif" fill="#2b2b2b" text-anchor="middle">27%</text>
<text x="200.0" y="378.0" font-size="10.5" fill="#555" text-anchor="middle">hub = K</text>
<text x="200.0" y="392.0" font-size="10.5" fill="#c0392b" text-anchor="middle">keine Herrschaft (6/8)</text>
<rect x="310.0" y="191.5" width="80" height="168.5" fill="#46CDB8" rx="3"/>
<text x="350.0" y="184.5" font-size="13" font-family="Georgia,serif" fill="#2b2b2b" text-anchor="middle">60%</text>
<text x="350.0" y="378.0" font-size="10.5" fill="#555" text-anchor="middle">hub = P</text>
<text x="350.0" y="392.0" font-size="10.5" fill="#2e7d32" text-anchor="middle">→ Apex P (8/8)</text>
<rect x="460.0" y="221.2" width="80" height="138.8" fill="#E36F9E" rx="3"/>
<text x="500.0" y="214.2" font-size="13" font-family="Georgia,serif" fill="#2b2b2b" text-anchor="middle">50%</text>
<text x="500.0" y="378.0" font-size="10.5" fill="#555" text-anchor="middle">hub = W</text>
<text x="500.0" y="392.0" font-size="10.5" fill="#2e7d32" text-anchor="middle">→ Apex W (4/8)</text>
<rect x="610.0" y="210.4" width="80" height="149.6" fill="#E36F9E" rx="3"/>
<text x="650.0" y="203.4" font-size="13" font-family="Georgia,serif" fill="#2b2b2b" text-anchor="middle">53%</text>
<text x="650.0" y="378.0" font-size="10.5" fill="#555" text-anchor="middle">hub = M</text>
<text x="650.0" y="392.0" font-size="10.5" fill="#c0392b" text-anchor="middle">→ Apex W (4/8)</text>
<text x="420" y="416" font-size="10.5" fill="#666" text-anchor="middle">Häufigstes Ergebnis über acht Keime (Median). Folgte der Apex rein der Netzposition, wären alle vier Säulen gleich hoch und je in ihrer Farbe.</text>
