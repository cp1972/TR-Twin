<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="720" height="430" fill="#fff"/>
<text x="40" y="47" font-size="11" fill="#777">Dasselbe Substrat, anders orientierter Sinn → andere Ausgänge. Doch der Sinn wirkt im Gewicht: „leichte“ Strukturen bleiben unbeherrschbar</text>
<line x1="120" y1="360.0" x2="570" y2="360.0" stroke="#e7e7e7"/>
<text x="114" y="363.0" font-size="10" fill="#9a9a9a" text-anchor="end">0%</text>
<line x1="120" y1="263.5" x2="570" y2="263.5" stroke="#e7e7e7"/>
<text x="114" y="266.5" font-size="10" fill="#9a9a9a" text-anchor="end">25%</text>
<line x1="120" y1="167.0" x2="570" y2="167.0" stroke="#e7e7e7"/>
<text x="114" y="170.0" font-size="10" fill="#9a9a9a" text-anchor="end">50%</text>
<rect x="150.0" y="263.3" width="74" height="96.7" fill="#cbd0d8" rx="3"/>
<text x="187.0" y="245.3" font-size="12" fill="#2b2b2b" text-anchor="middle">25%</text>
<text x="187.0" y="376.0" font-size="9.5" fill="#555" text-anchor="middle">ohne Sinn</text>
<text x="187.0" y="388.0" font-size="9.5" fill="#555" text-anchor="middle">(symmetrisch)</text>
<rect x="254.0" y="129.4" width="74" height="230.6" fill="#46CDB8" rx="3"/>
<text x="291.0" y="111.4" font-size="12" fill="#2b2b2b" text-anchor="middle">60%</text>
<text x="291.0" y="376.0" font-size="9.5" fill="#555" text-anchor="middle">Sinn → Politik</text>
<rect x="358.0" y="168.8" width="74" height="191.2" fill="#E36F9E" rx="3"/>
<text x="395.0" y="150.8" font-size="12" fill="#2b2b2b" text-anchor="middle">50%</text>
<text x="395.0" y="376.0" font-size="9.5" fill="#555" text-anchor="middle">Sinn → Wirtschaft</text>
<rect x="462.0" y="258.4" width="74" height="101.6" fill="#E8B14C" rx="3"/>
<text x="499.0" y="240.4" font-size="12" fill="#2b2b2b" text-anchor="middle">26%</text>
<text x="499.0" y="376.0" font-size="9.5" fill="#555" text-anchor="middle">Sinn → Kultur</text>
<text x="187" y="258.2684" font-size="9" fill="#777" text-anchor="middle">R=1.00</text>
<text x="291" y="124.39588" font-size="9" fill="#777" text-anchor="middle">R=0.28</text>
<text x="395" y="163.7756" font-size="9" fill="#777" text-anchor="middle">R=0.36</text>
<text x="499" y="253.38164" font-size="9" fill="#777" text-anchor="middle">R=0.94</text>
<text x="600" y="136" font-size="10.5" fill="#444" text-anchor="middle">Reziprozität R.</text>
<text x="600" y="164" font-size="9.5" fill="#888" text-anchor="middle">Ohne Sinn:</text>
<text x="600" y="178" font-size="9.5" fill="#888" text-anchor="middle">R=1, keine</text>
<text x="600" y="192" font-size="9.5" fill="#888" text-anchor="middle">Spannung —</text>
<text x="600" y="206" font-size="9.5" fill="#888" text-anchor="middle">die Zirkulation</text>
<text x="600" y="220" font-size="9.5" fill="#888" text-anchor="middle">löst auf, nicht</text>
<text x="600" y="234" font-size="9.5" fill="#888" text-anchor="middle">der Sinn.</text>
<text x="345" y="416" font-size="10.5" fill="#666" text-anchor="middle">Sinn → schwere Struktur: starke Herrschaft. Sinn → leichte (Kultur): kaum Wirkung, R bleibt hoch.</text>
</svg>