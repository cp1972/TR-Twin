<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="720" height="440" fill="#ffffff"/>
<text x="40" y="47" font-size="11" fill="#777">Warum Ungleichheit dauert: Personen wandern, die Grenze bleibt und setzt die Elite immer neu ein</text>
<rect x="270" y="80" width="180" height="64" rx="6" fill="#E36F9E" opacity="0.92"/>
<text x="360" y="108" font-size="13" fill="#fff" text-anchor="middle" font-family="Georgia,serif">Elite-Kategorie</text>
<text x="360" y="127" font-size="10.5" fill="#fff" text-anchor="middle">(monopolisierte Ressource)</text>
<line x1="120" y1="178" x2="600" y2="178" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2,4"/>
<text x="610" y="182" font-size="10.5" fill="#c0392b">Opportunity Hoarding:</text>
<text x="610" y="196" font-size="10.5" fill="#c0392b">geschlossene Grenze</text>
<rect x="120" y="240" width="120" height="58" rx="6" fill="#E8B14C" opacity="0.85"/>
<text x="180" y="274" font-size="12" fill="#333" text-anchor="middle">Außenseiter</text>
<path d="M180,240 L300,150" stroke="#777" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="300" y="240" width="120" height="58" rx="6" fill="#46CDB8" opacity="0.85"/>
<text x="360" y="274" font-size="12" fill="#333" text-anchor="middle">Außenseiter</text>
<path d="M360,240 L360,150" stroke="#777" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="480" y="240" width="120" height="58" rx="6" fill="#8C92EC" opacity="0.85"/>
<text x="540" y="274" font-size="12" fill="#333" text-anchor="middle">Außenseiter</text>
<path d="M540,240 L420,150" stroke="#777" stroke-width="1.6" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#777"/></marker></defs>
<text x="155" y="200" font-size="10.5" fill="#555">Ausbeutung: Wert fließt nach oben ↑</text>
<circle cx="180" cy="320" r="4" fill="#aaa"/>
<circle cx="210" cy="320" r="4" fill="#aaa"/>
<circle cx="540" cy="320" r="4" fill="#aaa"/>
<circle cx="570" cy="320" r="4" fill="#aaa"/>
<path d="M180,330 q40,40 360,0" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#ar)"/>
<text x="360" y="392" font-size="10.5" fill="#888" text-anchor="middle">Individuen migrieren (graue Punkte) — doch die Grenze bleibt und füllt die Elite immer wieder auf.</text>
<text x="360" y="412" font-size="11" fill="#444" text-anchor="middle" font-family="Georgia,serif">Nicht die Person, sondern die <tspan font-style="italic">Kategorie</tspan> trägt die Ungleichheit — deshalb ist sie dauerhaft.</text>
</svg>