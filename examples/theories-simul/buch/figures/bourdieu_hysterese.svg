<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="640" height="430" fill="#fff"/>
<text x="40" y="47" font-size="11" fill="#777">Bei gleichem Enddruck (α=1,2) entscheidet die Vergangenheit: einmal installiert, bleibt der Apex</text>
<line x1="150" y1="360" x2="560" y2="360" stroke="#eee"/>
<text x="144" y="363" font-size="9" fill="#9a9a9a" text-anchor="end">0%</text>
<line x1="150" y1="264" x2="560" y2="264" stroke="#eee"/>
<text x="144" y="267" font-size="9" fill="#9a9a9a" text-anchor="end">25%</text>
<line x1="150" y1="167" x2="560" y2="167" stroke="#eee"/>
<text x="144" y="170" font-size="9" fill="#9a9a9a" text-anchor="end">50%</text>
<rect x="210" y="264" width="120" height="96" fill="#bbb" rx="3"/>
<text x="270" y="257" font-size="13" fill="#2b2b2b" text-anchor="middle">25%</text>
<text x="270" y="378" font-size="10" fill="#555" text-anchor="middle">α konstant 1,2</text>
<text x="270" y="392" font-size="10" fill="#555" text-anchor="middle">(nie dominiert)</text>
<rect x="400" y="125" width="120" height="235" fill="#E36F9E" rx="3"/>
<text x="460" y="118" font-size="13" fill="#2b2b2b" text-anchor="middle">61%</text>
<text x="460" y="378" font-size="10" fill="#555" text-anchor="middle">α 1,8 → 1,2</text>
<text x="460" y="392" font-size="10" fill="#555" text-anchor="middle">(Vergangenheit der Herrschaft)</text>
<text x="355" y="418" font-size="10.5" fill="#888" text-anchor="middle">Apex-Größe am Ende. Derselbe Enddruck, gegensätzliches Ergebnis: die Herrschaft trägt sich selbst.</text>
</svg>