<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="720" height="430" fill="#ffffff"/>
<text x="40" y="30" font-size="15" font-family="Georgia,serif" fill="#2b2b2b">Abbildung 8.1 — Dauerhaftigkeit unter Mobilität</text>
<text x="40" y="47" font-size="11" fill="#777">Ungleichheit (GINI) bei steigender Migration: Whites Apex zerfällt, Tillys kategoriale Grenze hält</text>
<line x1="90" y1="360" x2="650" y2="360" stroke="#eee"/>
<text x="82" y="363" font-size="9" fill="#9a9a9a" text-anchor="end">0.0</text>
<line x1="90" y1="292" x2="650" y2="292" stroke="#eee"/>
<text x="82" y="296" font-size="9" fill="#9a9a9a" text-anchor="end">0.1</text>
<line x1="90" y1="225" x2="650" y2="225" stroke="#eee"/>
<text x="82" y="228" font-size="9" fill="#9a9a9a" text-anchor="end">0.2</text>
<line x1="90" y1="158" x2="650" y2="158" stroke="#eee"/>
<text x="82" y="161" font-size="9" fill="#9a9a9a" text-anchor="end">0.3</text>
<line x1="90" y1="90" x2="650" y2="90" stroke="#eee"/>
<text x="82" y="93" font-size="9" fill="#9a9a9a" text-anchor="end">0.4</text>
<text x="90" y="378" font-size="9.5" fill="#666" text-anchor="middle">0.5</text>
<text x="230" y="378" font-size="9.5" fill="#666" text-anchor="middle">0.8</text>
<text x="370" y="378" font-size="9.5" fill="#666" text-anchor="middle">1.1</text>
<text x="510" y="378" font-size="9.5" fill="#666" text-anchor="middle">1.4</text>
<text x="650" y="378" font-size="9.5" fill="#666" text-anchor="middle">1.7</text>
<text x="370" y="400" font-size="10.5" fill="#555" text-anchor="middle">Migration (mig)</text>
<polyline points="90,104 230,130 370,360 510,353 650,353" fill="none" stroke="#8C92EC" stroke-width="2.5"/>
<circle cx="90" cy="104" r="3.5" fill="#8C92EC"/>
<circle cx="230" cy="130" r="3.5" fill="#8C92EC"/>
<circle cx="370" cy="360" r="3.5" fill="#8C92EC"/>
<circle cx="510" cy="353" r="3.5" fill="#8C92EC"/>
<circle cx="650" cy="353" r="3.5" fill="#8C92EC"/>
<polyline points="90,97 230,232 370,313 510,299 650,292" fill="none" stroke="#E36F9E" stroke-width="2.5"/>
<circle cx="90" cy="97" r="3.5" fill="#E36F9E"/>
<circle cx="230" cy="232" r="3.5" fill="#E36F9E"/>
<circle cx="370" cy="313" r="3.5" fill="#E36F9E"/>
<circle cx="510" cy="299" r="3.5" fill="#E36F9E"/>
<circle cx="650" cy="292" r="3.5" fill="#E36F9E"/>
<rect x="470" y="80" width="14" height="14" fill="#8C92EC"/><text x="490" y="92" font-size="11" fill="#444">White (emergent)</text>
<rect x="470" y="102" width="14" height="14" fill="#E36F9E"/><text x="490" y="114" font-size="11" fill="#444">Tilly (kategorial)</text>
<text x="370" y="420" font-size="10" fill="#888" text-anchor="middle">Bei mig ≥ 1,1 fällt Whites GINI auf null (Gleichheit), Tillys bleibt positiv (dauerhafte Ungleichheit).</text>
</svg>