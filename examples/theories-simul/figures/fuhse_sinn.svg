<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="720" height="430" fill="#fff"/>
<text x="40" y="30" font-size="15" font-family="Georgia,serif" fill="#2b2b2b">Abbildung 11.4 — Die Bänder tragen Sinn (Fuhse/Mische)</text>
<text x="40" y="47" font-size="11" fill="#777">Dasselbe Substrat, anders orientierter Sinn → andere Ausgänge. Doch der Sinn wirkt im Gewicht: „leichte“ Strukturen bleiben unbeherrschbar</text>
<line x1="120" y1="360" x2="560" y2="360" stroke="#eee"/>
<text x="114" y="363" font-size="9" fill="#9a9a9a" text-anchor="end">0%</text>
<line x1="120" y1="264" x2="560" y2="264" stroke="#eee"/>
<text x="114" y="267" font-size="9" fill="#9a9a9a" text-anchor="end">25%</text>
<line x1="120" y1="167" x2="560" y2="167" stroke="#eee"/>
<text x="114" y="170" font-size="9" fill="#9a9a9a" text-anchor="end">50%</text>
<rect x="150" y="264" width="74" height="96" fill="#cbd0d8" rx="2"/>
<text x="187" y="246" font-size="12" fill="#2b2b2b" text-anchor="middle">25%</text>
<text x="187" y="259" font-size="9" fill="#777" text-anchor="middle">R=1.00</text>
<text x="187" y="376" font-size="9.5" fill="#555" text-anchor="middle">ohne Sinn</text>
<text x="187" y="388" font-size="9.5" fill="#555" text-anchor="middle">(symmetrisch)</text>
<rect x="254" y="148" width="74" height="212" fill="#46CDB8" rx="2"/>
<text x="291" y="130" font-size="12" fill="#2b2b2b" text-anchor="middle">55%</text>
<text x="291" y="143" font-size="9" fill="#777" text-anchor="middle">R=0.33</text>
<text x="291" y="376" font-size="9.5" fill="#555" text-anchor="middle">Sinn → Politik</text>
<rect x="358" y="186" width="74" height="174" fill="#E36F9E" rx="2"/>
<text x="395" y="168" font-size="12" fill="#2b2b2b" text-anchor="middle">45%</text>
<text x="395" y="181" font-size="9" fill="#777" text-anchor="middle">R=0.45</text>
<text x="395" y="376" font-size="9.5" fill="#555" text-anchor="middle">Sinn → Wirtschaft</text>
<rect x="462" y="256" width="74" height="104" fill="#E8B14C" rx="2"/>
<text x="499" y="238" font-size="12" fill="#2b2b2b" text-anchor="middle">27%</text>
<text x="499" y="251" font-size="9" fill="#777" text-anchor="middle">R=0.93</text>
<text x="499" y="376" font-size="9.5" fill="#555" text-anchor="middle">Sinn → Kultur</text>
<text x="600" y="120" font-size="10.5" fill="#444">Apex (Balken) +</text>
<text x="600" y="136" font-size="10.5" fill="#444">Reziprozität R.</text>
<text x="600" y="162" font-size="9.5" fill="#888">Ohne Sinn:</text>
<text x="600" y="176" font-size="9.5" fill="#888">R=1, keine</text>
<text x="600" y="190" font-size="9.5" fill="#888">Spannung —</text>
<text x="600" y="204" font-size="9.5" fill="#888">die Zirkulation</text>
<text x="600" y="218" font-size="9.5" fill="#888">löst auf, nicht</text>
<text x="600" y="232" font-size="9.5" fill="#888">der Sinn.</text>
<text x="340" y="408" font-size="10.5" fill="#888" text-anchor="middle">Sinn → schwere Struktur: starke Herrschaft. Sinn → leichte (Kultur): kaum Wirkung, R bleibt hoch.</text>
</svg>