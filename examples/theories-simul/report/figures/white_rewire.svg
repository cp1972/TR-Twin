<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="780" height="430" fill="#ffffff"/>
<text x="40" y="30" font-size="15" font-family="Georgia,serif" fill="#2b2b2b">Abbildung 7.2 — Strukturelle Äquivalenz als Residuum</text>
<text x="40" y="47" font-size="11" fill="#777">Wird das Netz umverdrahtet (hub = kontrollierende Position), folgt der Apex nur teilweise: ein Rest-Gefälle bevorzugt Politik</text>
<line x1="120" y1="360" x2="720" y2="360" stroke="#eee"/>
<text x="112" y="363" font-size="9" fill="#9a9a9a" text-anchor="end">0</text>
<line x1="120" y1="290" x2="720" y2="290" stroke="#eee"/>
<text x="112" y="293" font-size="9" fill="#9a9a9a" text-anchor="end">25</text>
<line x1="120" y1="220" x2="720" y2="220" stroke="#eee"/>
<text x="112" y="223" font-size="9" fill="#9a9a9a" text-anchor="end">50</text>
<line x1="120" y1="150" x2="720" y2="150" stroke="#eee"/>
<text x="112" y="153" font-size="9" fill="#9a9a9a" text-anchor="end">75</text>
<rect x="160" y="284.4" width="80" height="75.6" fill="#E8B14C" rx="2" opacity="1.0"/>
<text x="200.0" y="278.4" font-size="11" fill="#2b2b2b" text-anchor="middle">27%</text>
<text x="200.0" y="378" font-size="11" fill="#333" text-anchor="middle">hub = K</text>
<text x="200.0" y="394" font-size="10" fill="#2e7d32" text-anchor="middle">→ Apex K  ✓</text>
<rect x="310" y="194.8" width="80" height="165.2" fill="#46CDB8" rx="2" opacity="1.0"/>
<text x="350.0" y="188.8" font-size="11" fill="#2b2b2b" text-anchor="middle">59%</text>
<text x="350.0" y="378" font-size="11" fill="#333" text-anchor="middle">hub = P</text>
<text x="350.0" y="394" font-size="10" fill="#2e7d32" text-anchor="middle">→ Apex P  ✓</text>
<rect x="460" y="194.8" width="80" height="165.2" fill="#46CDB8" rx="2" opacity="0.92"/>
<text x="500.0" y="188.8" font-size="11" fill="#2b2b2b" text-anchor="middle">59%</text>
<text x="500.0" y="378" font-size="11" fill="#333" text-anchor="middle">hub = W</text>
<text x="500.0" y="394" font-size="10" fill="#c0392b" text-anchor="middle">→ Apex P  ✗</text>
<rect x="610" y="192.0" width="80" height="168.0" fill="#46CDB8" rx="2" opacity="0.92"/>
<text x="650.0" y="186.0" font-size="11" fill="#2b2b2b" text-anchor="middle">60%</text>
<text x="650.0" y="378" font-size="11" fill="#333" text-anchor="middle">hub = M</text>
<text x="650.0" y="394" font-size="10" fill="#c0392b" text-anchor="middle">→ Apex P  ✗</text>
<text x="420" y="416" font-size="10.5" fill="#666" text-anchor="middle">Folgte der Apex rein der Netzposition (strukturelle Äquivalenz), wären alle vier Säulen gleich hoch und je in ihrer Farbe.</text>
</svg>