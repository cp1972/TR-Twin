<text x="546" y="368" font-size="10" fill="#555" text-anchor="middle">M</text>
<text x="395" y="392" font-size="10.5" fill="#888" text-anchor="middle">Balken = innere Reziprozität je Struktur. Der Apex (P) ist innerlich top (0,95), das System (rote Linie) liegt bei 0,33.</text>
